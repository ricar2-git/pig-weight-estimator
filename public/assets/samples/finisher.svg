  <rect x="30" y="30" width="230" height="42" rx="8" fill="#1e293b" opacity="0.85" />
  <text x="45" y="56" font-family="sans-serif" font-weight="bold" font-size="16" fill="#f43f5e">● SAMPLE 3: FINISHER</text>
