  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)" />
  <line x1="0" y1="430" x2="800" y2="430" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="10 10" />
  <rect x="0" y="430" width="800" height="70" fill="#f1f5f9" />

  <!-- Shadow -->
  <ellipse cx="430" cy="435" rx="270" ry="34" fill="rgba(0,0,0,0.25)" />

